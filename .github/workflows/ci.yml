name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint, types and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.7', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.8'
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install locked development dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run --locked python -m pytest -q tests
      - name: Check lint
        run: uv run --locked python -m ruff check
      - name: Check types
        run: uv run --locked python -m pyright
      - name: Build distributions
        run: uv build
